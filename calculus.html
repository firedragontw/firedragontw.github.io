<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --board: #2f5b52;
  --board-deep: #24473f;
  --grid: rgba(255,255,255,0.07);
  --chalk: #f1efe4;
  --chalk-dim: rgba(241,239,228,0.55);
  --chalk-yellow: #f3d46a;
  --chalk-pink: #f0a3ae;
  --chalk-white: #f4f2ea;

  --paper: #fbfaf5;
  --paper-2: #f2f0e8;
  --ink: #1f2b28;
  --ink-2: #4c5a56;
  --ink-3: #8a9591;
  --rule: #d9d5c8;
  --accent: #2f5b52;
  --accent-soft: #e4ede9;
  --ok: #2e7d5b;
  --ok-soft: #dff0e6;
  --bad: #b8434e;
  --bad-soft: #f7e1e3;

  --card-paper: #fffdf7;
  --card-shadow: 0 2px 0 rgba(0,0,0,0.35);

  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b2321;
    --paper-2: #232d2a;
    --ink: #e9ece8;
    --ink-2: #b7c0bc;
    --ink-3: #7f8a86;
    --rule: #34403c;
    --accent: #8fc7b4;
    --accent-soft: #24332e;
    --ok: #7fd1a8;
    --ok-soft: #1f3b30;
    --bad: #f08a94;
    --bad-soft: #3d2326;
    --card-paper: #2a3431;
  }
}
:root[data-theme="dark"] {
  --paper: #1b2321;
  --paper-2: #232d2a;
  --ink: #e9ece8;
  --ink-2: #b7c0bc;
  --ink-3: #7f8a86;
  --rule: #34403c;
  --accent: #8fc7b4;
  --accent-soft: #24332e;
  --ok: #7fd1a8;
  --ok-soft: #1f3b30;
  --bad: #f08a94;
  --bad-soft: #3d2326;
  --card-paper: #2a3431;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--board);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: none;
}
*, *::before, *::after { box-sizing: inherit; }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--chalk-yellow); outline-offset: 2px; }
mjx-container { line-height: 0; }
mjx-container svg { vertical-align: -0.2em; }

/* ───────── 黑板 ───────── */
#board {
  position: relative; width: 100%; height: 100%;
  overflow: auto;
  background-color: var(--board);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
  cursor: grab;
  touch-action: pan-x pan-y;
}
#board.panning { cursor: grabbing; }
#canvas { position: relative; width: 1560px; height: 940px; }
#edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#edges .edge { fill: none; stroke: var(--chalk-dim); stroke-width: 2; stroke-linecap: round; }
#edges .edge.dep { stroke: var(--chalk); stroke-width: 2.2; }
#edges .edge.equiv { stroke: var(--chalk-yellow); stroke-dasharray: 9 7; stroke-width: 2.4; }
#edges .edge.borrow { stroke: var(--chalk-pink); stroke-dasharray: 2 6; stroke-width: 2.6; }
#edges .edge.analogy { stroke: rgba(241,239,228,0.32); stroke-dasharray: 1 7; stroke-width: 3; }
#edges .edge-label { font: 500 12px var(--sans); fill: var(--board-deep); }
#edges .edge-label-bg { fill: var(--chalk-pink); rx: 10; opacity: 0.95; }
#edges .edge-label.eq { fill: var(--board-deep); }
#edges .edge-label-bg.eq { fill: var(--chalk-yellow); }
#edges.drawn .edge { stroke-dasharray: none; }
#edges .edge.dep.draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: chalk 1.1s ease-out forwards; }
@keyframes chalk { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { #edges .edge.dep.draw { animation: none; stroke-dashoffset: 0; } }

.node {
  position: absolute; width: 232px; min-height: 92px;
  background: var(--card-paper); color: #1f2b28;
  border-radius: 3px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.38), 0 8px 18px rgba(0,0,0,0.18);
  padding: 12px 14px 12px 16px;
  cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.node::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  border-radius: 3px 0 0 3px; background: var(--tag);
}
.node::after {
  content: ""; position: absolute; top: -7px; left: 50%; width: 34px; height: 12px; margin-left: -17px;
  background: rgba(255,255,255,0.55); transform: rotate(-3deg); border-radius: 1px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.15);
}
.node.dragging { cursor: grabbing; box-shadow: 0 10px 0 rgba(0,0,0,0.25), 0 24px 30px rgba(0,0,0,0.3); transform: scale(1.02); z-index: 5; }
.node .n-title { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0 0 4px; }
.node .n-sum { font-size: 14px; color: #4c5a56; line-height: 1.4; }
.node .n-sum mjx-container svg { max-width: 100%; }
.node[data-group="limit"] { --tag: var(--chalk-white); }
.node[data-group="conti"] { --tag: var(--chalk-yellow); }
.node[data-group="diff"] { --tag: var(--chalk-pink); }
.node[data-group="limit"]::before { background: #cfd6d1; }

#board-title {
  position: fixed; left: 28px; top: calc(22px + env(safe-area-inset-top, 0px)); z-index: 3;
  color: var(--chalk); pointer-events: none;
}
#board-title h1 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0; letter-spacing: 0.02em; }
#board-title p { margin: 4px 0 0; font-size: 13px; color: var(--chalk-dim); }
#board-title p b { color: var(--chalk-yellow); font-weight: 500; }

#legend {
  position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 3;
  background: rgba(36,71,63,0.92); color: var(--chalk);
  border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  backdrop-filter: blur(4px);
}
#legend .lg { display: flex; align-items: center; gap: 10px; }
#legend .lg + .lg { margin-top: 5px; }
#legend svg { width: 54px; height: 12px; flex: none; }
#legend .lg small { color: var(--chalk-dim); }

#toolbar {
  position: fixed; right: 20px; top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 3;
  display: flex; gap: 8px;
}
#toolbar button {
  background: rgba(36,71,63,0.92); color: var(--chalk); border: 1px solid rgba(241,239,228,0.25);
  border-radius: 8px; padding: 8px 14px; font-size: 14px;
}
#toolbar button:hover { background: var(--board-deep); }

/* ───────── 講義（節點內容） ───────── */

  position: fixed; inset: 0; z-index: 20;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(20,38,34,0.55);
}
#sheet.open { display: flex; }
#sheet .paper {
  width: 100%; max-width: 900px; height: 94%;
  background: var(--paper); color: var(--ink);
  border-radius: 14px 14px 0 0;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.35);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#sheet.open .paper { transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { #sheet .paper { transition: none; } }
.paper-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px 12px; border-bottom: 1px solid var(--rule);
}
.paper-head .tag { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; background: var(--tag); border: 1px solid rgba(0,0,0,0.15); }
.paper-head h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
.paper-head button { background: none; border: 1px solid var(--rule); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.paper-head button:hover { border-color: var(--ink-2); }
.paper-body { overflow-y: auto; padding: 8px 22px 40px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.paper-body > .col { max-width: 720px; margin: 0 auto; }
.sec { padding: 20px 0 6px; }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 10px; }
.sec p { margin: 8px 0; }
.sec ul { margin: 8px 0; padding-left: 20px; }
.sec li { margin: 4px 0; }
.sec .thm { background: var(--paper-2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 10px 0; }
.sec .thm b { color: var(--accent); }
.sec .note { font-size: 14px; color: var(--ink-2); background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
.sec .disp { text-align: center; margin: 10px 0; overflow-x: auto; }
.sec .rel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.sec .rel button {
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--ink);
}
.sec .rel button span { color: var(--ink-3); font-size: 12px; margin-right: 6px; }
.sec .rel button:hover { border-color: var(--accent); }

/* ───────── 練習 ───────── */
.practice { padding-bottom: 8px; }
.practice .p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.practice .p-head p { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
.practice .p-progress { font-size: 13px; color: var(--ink-3); }
.pline { margin: 10px 0; line-height: 2.3; }
.blank {
  display: inline-block; vertical-align: baseline;
  min-width: 64px; height: 1.85em; line-height: 1.75em;
  padding: 0 10px; margin: 0 3px;
  border: 1.5px dashed var(--ink-3); border-radius: 6px;
  background: var(--paper-2);
  text-align: center; color: var(--ink-3);
  cursor: pointer; transition: border-color .15s, background .15s, transform .15s;
}
.blank.next { border-color: var(--accent); background: var(--accent-soft); }
.blank.over { border-style: solid; border-color: var(--accent); background: var(--accent-soft); transform: scale(1.04); }
.blank.filled {
  border: 1.5px solid var(--ok); background: var(--ok-soft); color: var(--ink);
  cursor: default; animation: pop .28s cubic-bezier(.2,1.4,.4,1);
}
.blank.wrong { animation: shake .4s; border-color: var(--bad); background: var(--bad-soft); }
@keyframes pop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.hint { font-size: 13px; color: var(--bad); margin: -4px 0 8px; min-height: 1.4em; }
.tray {
  position: sticky; bottom: 0; margin-top: 14px;
  background: var(--paper); border-top: 1px solid var(--rule);
  padding: 12px 0 8px;
}
.tray .t-label { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.tray .t-label button { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0; text-decoration: underline; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; }
.card {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 6px 13px; min-height: 38px;
  background: var(--card-paper); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 7px;
  box-shadow: 0 1.5px 0 rgba(0,0,0,0.18);
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  transition: transform .15s, opacity .2s, box-shadow .15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 3px 0 rgba(0,0,0,0.18); }
.card.lifted { opacity: 0.25; }
.card.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
.card.wrong { animation: shake .4s; border-color: var(--bad); background: var(--bad-soft); }
.ghost {
  position: fixed; z-index: 100; pointer-events: none;
  transform: translate(-50%, -50%) rotate(-2deg) scale(1.06);
  box-shadow: 0 10px 24px rgba(0,0,0,0.28);
  transition: none;
}
.ghost.fly { transition: left .32s cubic-bezier(.2,.9,.3,1), top .32s cubic-bezier(.2,.9,.3,1), transform .32s; }
.done {
  display: none; margin-top: 14px; padding: 14px 16px;
  background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 10px;
  align-items: center; gap: 14px;
}
.done.show { display: flex; animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
.done svg { width: 34px; height: 34px; flex: none; }
.done svg path { stroke: var(--ok); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: tick .6s .15s ease-out forwards; }
@keyframes tick { to { stroke-dashoffset: 0; } }
.done b { color: var(--ok); }
.done button { margin-left: auto; background: var(--ok); color: #fff; border: none; border-radius: 999px; padding: 7px 14px; }

@media (max-width: 720px) {
  .node { width: 200px; }
  #board-title h1 { font-size: 19px; }
  #legend { font-size: 12px; padding: 10px 12px; }
  #toolbar button { padding: 7px 10px; font-size: 13px; }
  .paper-head h2 { font-size: 19px; }
  .pline { line-height: 2.4; }
}
</style>

  </div>

        </marker>

<script>
const R = String.raw;

/* 節點資料：id、群組、標題、卡片摘要、初始位置、內容段落、練習
   練習 lines 中用 [[答案]] 標記空格，可用 [[答案|提示]] 附提示 */
const NODES = [
{
  id: 'limit', group: 'limit', x: 40, y: 380,
  title: '極限存在',
  sum: R`$\lim_{x\to a} f(x) = L$`,
  sections: [
    { h: '定義（ε-δ）', html: R`
      <div class="thm"><b>定義</b>　$\displaystyle\lim_{x\to a}f(x)=L$ 表示：對任意 $\varepsilon>0$，存在 $\delta>0$，使得只要 $0<|x-a|<\delta$，就有 $|f(x)-L|<\varepsilon$。</div>
      <p>白話：不管你要 $f(x)$ 跟 $L$ 多接近，我都找得到一個夠小的範圍，只要 $x$ 落在裡面（但不等於 $a$），$f(x)$ 就一定夠接近 $L$。注意 $x=a$ 那一點本身不算在內。</p>` },
    { h: '等價敘述（板書）', html: R`
      <div class="disp">$\displaystyle\lim_{x\to a}f(x)=L \iff \lim_{x\to a^-}f(x)=\lim_{x\to a^+}f(x)=L$</div>
      <div class="disp">$\displaystyle\lim_{x\to a}f(x)=L \iff \lim_{x\to a}\big(f(x)-L\big)=0 \iff \lim_{x\to a}\big|f(x)-L\big|=0$</div>
      <div class="disp">$\displaystyle\lim_{x\to a}f(x)=L \iff \lim_{h\to0}f(a+h)=L$（代換 $x=a+h$）</div>
      <p>第一條最常用：左右極限算出來不一樣，就能斷定極限不存在。第三條在證三角函數極限時會用到（把 $\sin(a+h)$ 用和角公式展開）。</p>` },
    { h: '極限不存在的例子', html: R`
      <p>$\displaystyle\lim_{x\to0}\sin\frac1x$ 不存在：$x\to0$ 時 $\frac1x\to\pm\infty$，$\sin$ 在 $-1$ 與 $1$ 之間無限次來回震盪，不趨近任何單一值。</p>
      <p class="note">不能寫成「$=\sin(\infty)$」，極限符號不能直接代入無窮大。</p>` }
  ],
  practice: {
    title: '拼出極限的定義與等價敘述',
    lines: [
      R`$\displaystyle\lim_{x\to a}f(x)=L$ 的意思是：對 [[任意|ε 是「任何人來挑戰都要成立」的量]] $\varepsilon>0$，[[存在|δ 是「我只要找得到一個就好」的量]] $\delta>0$，使得只要 [[$0<|x-a|<\delta$|x 不能等於 a 本身]]，就有 [[$|f(x)-L|<\varepsilon$]]。`,
      R`$\displaystyle\lim_{x\to a}f(x)=L$ [[若且唯若|這是雙向的等價關係]] $\displaystyle\lim_{x\to a^-}f(x)=\lim_{x\to a^+}f(x)$ [[$=L$]]。`,
      R`若左極限與右極限都存在但 [[不相等]]，則 $\displaystyle\lim_{x\to a}f(x)$ [[不存在]]。`,
      R`代換 $x=a+h$：$\displaystyle\lim_{x\to a}f(x)=L \iff \lim_{h\to0}$ [[$f(a+h)$]] $=L$。`
    ],
    distractors: [

      <p>極限存在，所以是可移除的。修補後：</p>
      <div class="disp">$h(x)=\begin{cases}\dfrac{x^2-x-2}{x-2},&x\ne2\\[6pt]3,&x=2\end{cases}$，$h$ 在 $2$ 連續。</div>
      <p>相對地，$\sin\frac1x$ 在 $0$ 極限不存在，是不可移除的；$\lfloor x\rfloor$ 在整數點左右極限不等，也是不可移除的。</p>

  id: 'deriv', group: 'diff', x: 640, y: 510,
  title: '微分的定義與切線方程式',
  sum: R`$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$`,
  sections: [
    { h: '定義', html: R`
      <div class="thm"><b>定義</b>　$f$ 在 $a$ 的導數為
      $$f'(a)=\lim_{x\to a}\frac{f(x)-f(a)}{x-a}=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$
      若這個極限存在，稱 $f$ 在 $a$ <b>可微</b>。$f$ 在 $(a,b)$ 可微，若在每一點 $c\in(a,b)$ 都可微。</div>
      <p>兩種寫法差一個代換 $x=a+h$。$f'(x)$ 是 $x$ 的函數，定義域是所有讓這個極限存在的 $x$。</p>
      <p>記號：$f'(x)=y'=\dfrac{dy}{dx}=\dfrac{df}{dx}=\dfrac{d}{dx}f(x)=Df(x)=D_xf(x)$，而 $f'(a)=f'(x)\big|_{x=a}$。</p>` },
    { h: '導數＝切線斜率', html: R`
      <p>$\dfrac{f(x)-f(a)}{x-a}$ 是割線斜率；$x\to a$ 時割線趨近切線，所以 $f'(a)$ 就是 $y=f(x)$ 在 $(a,f(a))$ 處切線的斜率 $m$。</p>
      <div class="thm"><b>切線方程式</b>　$y-f(a)=f'(a)\,(x-a)$</div>
      <p>若 $f'(a)=0$，切線是水平線 $y=f(a)$。板書例：$y=x^4-6x^2+4$ 的水平切線，令 $y'=4x^3-12x=4x(x^2-3)=0$ 得 $x=0,\pm\sqrt3$。</p>` },
    { h: '板書例：直接用定義算', html: R`

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NODE_BY_ID = Object.fromEntries(NODES.map(n => [n.id, n]));
  const STORE_KEY = 'calc-map-positions-v1';

  /* ── MathJax：載入前先排隊，載入後補排版 ── */
  let mjReady = false;
  const pending = [];
  window.__mjReady = () => { mjReady = true; pending.splice(0).forEach(el => typeset(el)); };
  function typeset(el) {
    if (mjReady && window.MathJax && MathJax.typesetPromise) {
      return MathJax.typesetPromise([el]).catch(() => {});
    }
    pending.push(el);
    return Promise.resolve();
  }
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    MathJax.startup.promise.then(() => window.__mjReady());
  }

  /* ── 位置存取 ── */
  function loadPositions() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
  }
  function savePositions() {
    const pos = {};
    $$('.node').forEach(el => { pos[el.dataset.id] = { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }; });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(pos)); } catch (e) {}
  }

  /* ── 黑板：節點 ── */
  const board = $('#board');
  const canvas = $('#canvas');
  const nodesEl = $('#nodes');
  const linesG = $('#edge-lines');
  const labelsG = $('#edge-labels');
  const CW = canvas.offsetWidth, CH = canvas.offsetHeight;

  function renderNodes() {
    const saved = loadPositions();
    nodesEl.innerHTML = '';
    NODES.forEach(n => {
      const el = document.createElement('div');
      el.className = 'node';
      el.dataset.id = n.id;
      el.dataset.group = n.group;
      const p = saved[n.id] || { x: n.x, y: n.y };
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.innerHTML = `<div class="n-title">${n.title}</div><div class="n-sum">${n.sum}</div>`;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(n.id); } });
      attachNodeDrag(el);
      nodesEl.appendChild(el);
    });
    typeset(nodesEl).then(drawEdges);
  }

  function attachNodeDrag(el) {
    let start = null, moved = false;
    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, left: parseFloat(el.style.left), top: parseFloat(el.style.top) };
      moved = false;
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      if (!moved) { moved = true; el.classList.add('dragging'); }
      const w = el.offsetWidth, h = el.offsetHeight;
      const nx = Math.max(0, Math.min(CW - w, start.left + dx));
      const ny = Math.max(0, Math.min(CH - h, start.top + dy));
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
      requestAnimationFrame(drawEdges);
    });
    const end = e => {
      if (!start) return;
      const wasMoved = moved;
      start = null; moved = false;
      el.classList.remove('dragging');
      if (wasMoved) { savePositions(); drawEdges(); }
      else if (e.type === 'pointerup') openSheet(el.dataset.id);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* ── 黑板：滑鼠拖曳平移（觸控用原生捲動） ── */
  let pan = null;
  board.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.target.closest('.node')) return;
    pan = { x: e.clientX, y: e.clientY, sl: board.scrollLeft, st: board.scrollTop };
    board.classList.add('panning');
  });
  board.addEventListener('pointermove', e => {
    if (!pan) return;
    board.scrollLeft = pan.sl - (e.clientX - pan.x);
    board.scrollTop = pan.st - (e.clientY - pan.y);
  });
  const endPan = () => { pan = null; board.classList.remove('panning'); };
  board.addEventListener('pointerup', endPan);
  board.addEventListener('pointercancel', endPan);
  board.addEventListener('pointerleave', endPan);

  /* ── 連線 ── */
  function rectOf(id) {
    const el = nodesEl.querySelector(`.node[data-id="${id}"]`);
    return { x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: el.offsetWidth, h: el.offsetHeight };
  }
  // 從矩形中心往目標點的射線，與矩形邊界的交點
  function borderPoint(r, tx, ty) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const dx = tx - cx, dy = ty - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const sx = (r.w / 2) / Math.abs(dx || 1e-9), sy = (r.h / 2) / Math.abs(dy || 1e-9);
    const s = Math.min(sx, sy);
    return { x: cx + dx * s, y: cy + dy * s };
  }
  let firstDraw = true;
  function drawEdges() {
    linesG.innerHTML = ''; labelsG.innerHTML = '';
    const gap = 6;
    EDGES.forEach(ed => {
      const a = rectOf(ed.from), b = rectOf(ed.to);
      const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      let p1 = borderPoint(a, bc.x, bc.y), p2 = borderPoint(b, ac.x, ac.y);
      const len = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
      const ux = (p2.x - p1.x) / len, uy = (p2.y - p1.y) / len;
      p1 = { x: p1.x + ux * gap, y: p1.y + uy * gap };
      p2 = { x: p2.x - ux * gap, y: p2.y - uy * gap };
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M${p1.x} ${p1.y} L${p2.x} ${p2.y}`);
      path.setAttribute('class', 'edge ' + ed.type + (firstDraw && ed.type === 'dep' ? ' draw' : ''));
      if (ed.type === 'dep') path.setAttribute('marker-end', 'url(#arrow-w)');
      if (ed.type === 'equiv') { path.setAttribute('marker-end', 'url(#arrow-y)'); path.setAttribute('marker-start', 'url(#arrow-y)'); }
      if (ed.type === 'borrow') path.setAttribute('marker-end', 'url(#arrow-p)');
      linesG.appendChild(path);
      if (ed.label) {
        const t = ed.t || 0.5; const mx = p1.x + (p2.x - p1.x) * t, my = p1.y + (p2.y - p1.y) * t;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('class', 'edge-label' + (ed.type === 'equiv' ? ' eq' : ''));
        text.setAttribute('x', mx); text.setAttribute('y', my + 4);
        text.setAttribute('text-anchor', 'middle');
        text.textContent = ed.label;
        g.appendChild(text);
        labelsG.appendChild(g);
        const w = text.getComputedTextLength ? text.getComputedTextLength() + 16 : ed.label.length * 12 + 16;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('class', 'edge-label-bg' + (ed.type === 'equiv' ? ' eq' : ''));
        rect.setAttribute('x', mx - w / 2); rect.setAttribute('y', my - 10);
        rect.setAttribute('width', w); rect.setAttribute('height', 20);
        g.insertBefore(rect, text);
      }
    });
    firstDraw = false;
  }

  $('#btn-reset-layout').addEventListener('click', () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    NODES.forEach(n => {
      const el = nodesEl.querySelector(`.node[data-id="${n.id}"]`);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    });
    drawEdges();
  });

  /* ── 講義面板 ── */
  const sheet = $('#sheet'), sheetTitle = $('#sheet-title'), sheetContent = $('#sheet-content');
  const tagEl = $('#sheet .tag');
  const GROUP_COLOR = { limit: '#d7ddd9', conti: '#f3d46a', diff: '#f0a3ae' };
  let currentPractice = null;

  function openSheet(id) {
    const n = NODE_BY_ID[id];
    sheetTitle.innerHTML = n.title;
    tagEl.style.setProperty('--tag', GROUP_COLOR[n.group]);
    sheetContent.innerHTML = '';
    n.sections.forEach(s => {
      const sec = document.createElement('section');
      sec.className = 'sec';
      sec.innerHTML = `<h3>${s.h}</h3>${s.html}`;
      sheetContent.appendChild(sec);
    });
    // 相關節點
    const rel = EDGES.filter(e => e.from === id || e.to === id);
    if (rel.length) {
      const sec = document.createElement('section');
      sec.className = 'sec';
      const btns = rel.map(e => {
        const otherId = e.from === id ? e.to : e.from;
        const dir = e.type === 'dep' ? (e.from === id ? '→ 被它用到' : '← 用到它') :
                    e.type === 'borrow' ? (e.from === id ? '→ 借給它' : '← 向它借') : '↔';
        return `<button type="button" data-open="${otherId}"><span>${EDGE_NAMES[e.type]} ${dir}</span>${NODE_BY_ID[otherId].title}</button>`;
      }).join('');
      sec.innerHTML = `<h3>地圖上相連的節點</h3><div class="rel">${btns}</div>`;
      sec.addEventListener('click', ev => { const b = ev.target.closest('[data-open]'); if (b) openSheet(b.dataset.open); });
      sheetContent.appendChild(sec);
    }
    // 練習
    if (n.practice) {
      const sec = document.createElement('section');
      sec.className = 'sec practice';
      sheetContent.appendChild(sec);
      currentPractice = buildPractice(n.practice, sec);
    }
    typeset(sheetContent);
    sheet.classList.add('open');
    $('.paper-body', sheet).scrollTop = 0;
  }
  function closeSheet() { sheet.classList.remove('open'); currentPractice = null; }
  $('#sheet-close').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

  /* ── 練習：解析 [[答案]] 與 [[答案|提示]]（只有 $…$ 之外的 | 算分隔） ── */
  function splitAnsHint(s) {
    let inMath = false;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === '$') inMath = !inMath;
      else if (ch === '|' && !inMath) return [s.slice(0, i).trim(), s.slice(i + 1).trim()];
    }
    return [s.trim(), ''];
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  function buildPractice(p, sec) {
    sec.innerHTML = `
      <div class="p-head"><h3>練習：${p.title}</h3><span class="p-progress"></span></div>
      <p>把正確的卡片拖進空格，或點一下卡片，它會依序填進下一個空格。填錯會彈回來。</p>
      <div class="plines"></div>
      <div class="hint" aria-live="polite"></div>
      <div class="done"><svg viewBox="0 0 34 34"><path d="M7 18 L14 25 L27 10"/></svg><div><b>全部正確。</b>這一段的定義／證明你自己拼出來了。</div><button type="button" class="again">再練一次</button></div>
      <div class="tray"><div class="t-label"><span>卡片（含干擾項）</span><button type="button" class="restart">重新開始</button></div><div class="pool"></div></div>`;
    const linesEl = $('.plines', sec), pool = $('.pool', sec), hintEl = $('.hint', sec), progress = $('.p-progress', sec), done = $('.done', sec);
    const blanks = [];
    const answers = [];
    const re = /\[\[([\s\S]+?)\]\]/g;
    p.lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'pline';
      let last = 0, m;
      while ((m = re.exec(line))) {
        div.appendChild(document.createTextNode(line.slice(last, m.index)));
        const [ans, hint] = splitAnsHint(m[1]);
        const b = document.createElement('span');
        b.className = 'blank'; b.dataset.ans = ans; b.dataset.hint = hint; b.textContent = '\u3000';
        b.setAttribute('role', 'button'); b.setAttribute('aria-label', '空格');
        b.addEventListener('click', () => { if (!b.classList.contains('filled')) showHint(b, false); });
        div.appendChild(b); blanks.push(b); answers.push(ans);
        last = re.lastIndex;
      }
      div.appendChild(document.createTextNode(line.slice(last)));
      linesEl.appendChild(div);
    });
    const cardTexts = shuffle(answers.concat(p.distractors));
    cardTexts.forEach(t => {
      const c = document.createElement('div');
      c.className = 'card'; c.dataset.text = t; c.innerHTML = t;
      attachCard(c);
      pool.appendChild(c);
    });

    const state = { blanks, filledCount: 0 };
    function nextBlank() { return blanks.find(b => !b.classList.contains('filled')) || null; }
    function markNext() {
      blanks.forEach(b => b.classList.remove('next'));
      const nb = nextBlank(); if (nb) nb.classList.add('next');
      progress.textContent = `${state.filledCount} / ${blanks.length}`;
    }
    function showHint(b, wrong) {
      const h = b.dataset.hint;
      hintEl.textContent = wrong ? (h ? `不是這張。提示：${h}` : '不是這張，再看一次這一格前後在講什麼。')
                                 : (h ? `提示：${h}` : '這一格要填什麼？從下面的卡片拖進來，或點一下卡片。');
      hintEl.style.color = wrong ? 'var(--bad)' : 'var(--ink-2)';
    }
    function fill(b, card) {
      b.innerHTML = card.innerHTML;
      b.classList.add('filled'); b.classList.remove('next', 'over');
      card.classList.add('gone');
      setTimeout(() => card.remove(), 220);
      state.filledCount++;
      hintEl.textContent = '';
      markNext();
      if (state.filledCount === blanks.length) {
        done.classList.add('show');
        $('.tray', sec).style.display = 'none';
      }
    }
    function reject(b, card) {
      b.classList.remove('wrong', 'over'); void b.offsetWidth; b.classList.add('wrong');
      card.classList.remove('wrong'); void card.offsetWidth; card.classList.add('wrong');
      setTimeout(() => { b.classList.remove('wrong'); card.classList.remove('wrong'); }, 450);
      showHint(b, true);
    }

    /* 卡片：拖曳 & 點擊 */
    function attachCard(card) {
      let start = null, ghost = null, dragging = false, over = null;
      const centerOf = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
      function makeGhost(x, y) {
        ghost = card.cloneNode(true);
        ghost.classList.add('ghost'); ghost.classList.remove('lifted', 'wrong');
        ghost.style.width = card.getBoundingClientRect().width + 'px';
        ghost.style.left = x + 'px'; ghost.style.top = y + 'px';
        document.body.appendChild(ghost);
      }
      function fly(to, after) {
        if (!ghost || reduceMotion) { if (ghost) ghost.remove(); ghost = null; after(); return; }
        const g = ghost; ghost = null;
        let doneFly = false;
        const finish = () => { if (doneFly) return; doneFly = true; g.remove(); after(); };
        g.addEventListener('transitionend', finish, { once: true });
        requestAnimationFrame(() => {
          g.classList.add('fly'); g.style.left = to.x + 'px'; g.style.top = to.y + 'px';
          g.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
        });
        setTimeout(finish, 420);
      }
      function setOver(el) {
        if (over && over !== el) over.classList.remove('over');
        over = el;
        if (over) over.classList.add('over');
      }
      function attempt(b, viaTap) {
        const ok = card.dataset.text === b.dataset.ans;
        if (ok) {
          card.classList.add('lifted');
          if (!ghost) makeGhost(centerOf(card).x, centerOf(card).y);
          fly(centerOf(b), () => fill(b, card));
        } else {
          if (ghost) fly(centerOf(card), () => { card.classList.remove('lifted'); });
          reject(b, card);
        }
      }
      card.addEventListener('pointerdown', e => {
        if (e.button !== undefined && e.button !== 0) return;
        if (card.classList.contains('gone')) return;
        start = { x: e.clientX, y: e.clientY }; dragging = false;
        card.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      card.addEventListener('pointermove', e => {
        if (!start) return;
        if (!dragging) {
          if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < 6) return;
          dragging = true; card.classList.add('lifted'); makeGhost(e.clientX, e.clientY);
        }
        ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
        const under = document.elementFromPoint(e.clientX, e.clientY);
        const b = under && under.closest ? under.closest('.blank') : null;
        setOver(b && !b.classList.contains('filled') && sec.contains(b) ? b : null);
      });
      const end = e => {
        if (!start) return;
        start = null;
        if (dragging) {
          dragging = false;
          const target = over; setOver(null);
          if (target && e.type === 'pointerup') attempt(target, false);
          else fly(centerOf(card), () => card.classList.remove('lifted'));
        } else if (e.type === 'pointerup') {
          const nb = nextBlank();
          if (nb) { nb.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); attempt(nb, true); }
        }
      };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
    }

    const restart = () => { buildPractice(p, sec); typeset(sec); };
    $('.restart', sec).addEventListener('click', restart);
    $('.again', sec).addEventListener('click', restart);
    markNext();
    return state;
  }

  renderNodes();
})();
</script>
</body>
</html>
