<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文易錯字讀音練習</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.75);
            --primary-color: #0071e3;
            --primary-hover: #0077ed;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --success-color: #34c759;
            --error-color: #ff3b30;
            --focus-shadow: 0 0 0 4px rgba(0, 113, 227, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app-container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 3px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
            font-feature-settings: "tnum";
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .word-section {
            text-align: center;
            position: relative;
            min-height: 400px;
        }
        
        .article-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .word-display {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: 0.1em;
            min-height: 4rem;
        }
        
        .context-sentence {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
            min-height: 2rem;
        }

        /* Drop Zone */
        .drop-zone {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 40px;
            padding: 30px;
            border: 3px dashed #d2d2d7;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.5);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            border-color: var(--primary-color);
            background: rgba(0, 113, 227, 0.1);
            transform: scale(1.02);
        }

        .drop-zone.correct {
            border-color: var(--success-color);
            background: rgba(52, 199, 89, 0.1);
        }

        .drop-zone.incorrect {
            border-color: var(--error-color);
            background: rgba(255, 59, 48, 0.1);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .drop-placeholder {
            color: #d2d2d7;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .dropped-item {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-main);
            padding: 10px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Options Grid */
        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .option-item {
            padding: 16px 12px;
            background: white;
            border: 2px solid #e5e5e7;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: grab;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .option-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.15);
        }

        .option-item:active {
            cursor: grabbing;
        }

        .option-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .option-item.used {
            opacity: 0.3;
            pointer-events: none;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .feedback-area {
            margin-top: 20px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .feedback-msg {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .feedback-msg.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .feedback-msg.correct { color: var(--success-color); }
        .feedback-msg.incorrect { color: var(--error-color); }
        
        .correct-answer-display {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }
        
        .btn-secondary {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
        }
        
        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .completion-screen {
            display: none;
            text-align: center;
            padding: 40px 0;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .completion-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .app-container { padding: 30px 20px; }
            .title { font-size: 2rem; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .word-display { font-size: 2.2rem; }
            .options-container { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1 class="title">國文易錯字練習</h1>
            <p class="subtitle">拖曳正確的注音到答案區</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="stats">

                <div class="stat-label">當前</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalWordsDisplay">0</div>
                <div class="stat-label">總計</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="correctCountDisplay">0</div>
                <div class="stat-label">正確</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="accuracyDisplay">0%</div>
                <div class="stat-label">準確率</div>
            </div>
        </div>
        
        <div id="practiceArea">
            <div class="word-section">
                <div class="article-name" id="articleName"></div>
                <div class="word-display" id="wordDisplay"></div>
                <div class="context-sentence" id="contextSentence"></div>
                
                <div class="drop-zone" id="dropZone">
                    <div class="drop-placeholder" id="dropPlaceholder">將注音拖曳至此</div>
                </div>

                <div class="options-container" id="optionsContainer"></div>

                <div class="feedback-area">
                    <div class="feedback-msg" id="feedbackText"></div>
                    <div class="correct-answer-display" id="correctAnswerText"></div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" onclick="shuffleAndRestart()">隨機順序</button>
                <button class="btn btn-secondary" onclick="restart()">重新開始</button>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="completion-icon">🎉</div>
            <h2 style="font-size: 2rem; margin-bottom: 15px;">太棒了！</h2>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">您已完成所有字詞練習</p>
            <button class="btn btn-primary" onclick="restart()">再次練習</button>
        </div>
    </div>

            { word: '幾', pronunciation: 'ㄐㄧ', context: '庶幾', article: '二十、畫菊自序' }
        ];

        // 常見混淆注音庫
        const confusingPronunciations = [
            'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ', 'ㄍ', 'ㄎ', 'ㄏ',
            'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ',
            'ㄧ', 'ㄨ', 'ㄩ', 'ㄚ', 'ㄛ', 'ㄜ', 'ㄝ', 'ㄞ', 'ㄟ', 'ㄠ', 'ㄡ',
            'ㄢ', 'ㄣ', 'ㄤ', 'ㄥ', 'ㄦ',
            'ㄧㄠ', 'ㄧㄡ', 'ㄧㄢ', 'ㄧㄣ', 'ㄧㄤ', 'ㄧㄥ',
            'ㄨㄚ', 'ㄨㄛ', 'ㄨㄞ', 'ㄨㄟ', 'ㄨㄢ', 'ㄨㄣ', 'ㄨㄤ', 'ㄨㄥ',
            'ㄩㄝ', 'ㄩㄢ', 'ㄩㄣ', 'ㄩㄥ',
            'ㄅㄧˋ', 'ㄆㄧˊ', 'ㄇㄧˇ', 'ㄈㄨˇ', 'ㄉㄨㄛˋ', 'ㄊㄨㄥˊ',
            'ㄋㄧㄝˋ', 'ㄌㄨˊ', 'ㄍㄨㄥ', 'ㄎㄨㄟˇ', 'ㄏㄨㄟ',

            'ㄖㄨㄢˇ', 'ㄗㄨˇ', 'ㄘㄨˊ', 'ㄙˋ',
            'ㄧˋ', 'ㄨˋ', 'ㄩˋ', 'ㄚˋ', 'ㄛˋ', 'ㄜˋ',
            'ㄞˋ', 'ㄟˋ', 'ㄠˋ', 'ㄡˋ', 'ㄢˋ', 'ㄣˋ', 'ㄤˋ', 'ㄥˋ'
        ];

        let state = {
            queue: [],
            currentIndex: 0,
            correctCount: 0,
            attempts: 0,
            currentOptions: [],
            selectedAnswer: null,
            draggedElement: null
        };

        const ui = {
            articleName: document.getElementById('articleName'),
            wordDisplay: document.getElementById('wordDisplay'),
            contextSentence: document.getElementById('contextSentence'),
            dropZone: document.getElementById('dropZone'),
            dropPlaceholder: document.getElementById('dropPlaceholder'),
            optionsContainer: document.getElementById('optionsContainer'),
            feedback: document.getElementById('feedbackText'),
            correctAnswer: document.getElementById('correctAnswerText'),
            progress: document.getElementById('progressFill'),
            stats: {
                current: document.getElementById('currentWordDisplay'),
                total: document.getElementById('totalWordsDisplay'),
                correct: document.getElementById('correctCountDisplay'),
                accuracy: document.getElementById('accuracyDisplay')
            },
            practiceArea: document.getElementById('practiceArea'),
            completionScreen: document.getElementById('completionScreen')
        };

        function init() {
            state.queue = [...vocabularyDB];
            state.currentIndex = 0;
            state.correctCount = 0;
            state.attempts = 0;
            updateStats();
            showWord();
            
            ui.practiceArea.style.display = 'block';
            ui.completionScreen.style.display = 'none';
        }

        function shuffleAndRestart() {
            for (let i = vocabularyDB.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabularyDB[i], vocabularyDB[j]] = [vocabularyDB[j], vocabularyDB[i]];
            }
            init();
        }

        function restart() {
            init();
        }

        function generateOptions(correctAnswer) {
            const options = [correctAnswer];
            const usedOptions = new Set([correctAnswer]);
            
            // 添加7個混淆選項
            while (options.length < 8) {
                const randomOption = confusingPronunciations[
                    Math.floor(Math.random() * confusingPronunciations.length)
                ];
                if (!usedOptions.has(randomOption)) {
                    options.push(randomOption);
                    usedOptions.add(randomOption);
                }
            }
            
            // 洗牌
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            return options;
        }

        function showWord() {
            if (state.currentIndex >= state.queue.length) {
                showCompletion();
                return;
            }

            const item = state.queue[state.currentIndex];
            ui.articleName.textContent = item.article;
            ui.wordDisplay.textContent = item.word;
            ui.contextSentence.textContent = item.context;
            
            // 重置 drop zone
            ui.dropZone.className = 'drop-zone';
            ui.dropZone.innerHTML = '<div class="drop-placeholder" id="dropPlaceholder">將注音拖曳至此</div>';
            ui.dropPlaceholder = document.getElementById('dropPlaceholder');
            state.selectedAnswer = null;
            
            // 生成選項
            state.currentOptions = generateOptions(item.pronunciation);
            renderOptions();
            
            ui.feedback.className = 'feedback-msg';
            ui.feedback.textContent = '';
            ui.correctAnswer.textContent = '';
            
            updateStats();
            setupDragAndDrop();
        }

        function renderOptions() {
            ui.optionsContainer.innerHTML = '';
            state.currentOptions.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option-item';
                optionDiv.textContent = option;
                optionDiv.draggable = true;
                optionDiv.dataset.pronunciation = option;
                optionDiv.dataset.index = index;
                ui.optionsContainer.appendChild(optionDiv);
            });
        }

        function setupDragAndDrop() {
            const options = ui.optionsContainer.querySelectorAll('.option-item');
            
            options.forEach(option => {
                option.addEventListener('dragstart', handleDragStart);
                option.addEventListener('dragend', handleDragEnd);
            });

            ui.dropZone.addEventListener('dragover', handleDragOver);
            ui.dropZone.addEventListener('drop', handleDrop);
            ui.dropZone.addEventListener('dragleave', handleDragLeave);
        }

        function handleDragStart(e) {
            state.draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.innerHTML);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            ui.dropZone.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            ui.dropZone.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();

            ui.dropZone.classList.remove('drag-over');

            if (state.draggedElement) {
                const pronunciation = state.draggedElement.dataset.pronunciation;
                state.selectedAnswer = pronunciation;
                
                // 顯示在 drop zone
                ui.dropZone.innerHTML = `<div class="dropped-item">${pronunciation}</div>`;
                
                // 標記該選項為已使用
                state.draggedElement.classList.add('used');
                
                // 檢查答案
                setTimeout(() => checkAnswer(), 300);
            }

            return false;
        }

        function checkAnswer() {
            const currentWord = state.queue[state.currentIndex];
            
            if (state.selectedAnswer === currentWord.pronunciation) {
                ui.dropZone.classList.add('correct');
                ui.feedback.textContent = '正確！';
                ui.feedback.className = 'feedback-msg show correct';
                state.correctCount++;
                state.attempts++;
                
                setTimeout(() => {
                    state.currentIndex++;
                    showWord();
                }, 1000);
            } else {
                ui.dropZone.classList.add('incorrect');
                ui.feedback.textContent = '錯誤';
                ui.feedback.className = 'feedback-msg show incorrect';
                ui.correctAnswer.textContent = `正確答案：${currentWord.pronunciation}`;
                state.attempts++;
                
                setTimeout(() => {
                    // 重置讓用戶再試一次
                    ui.dropZone.className = 'drop-zone';
                    ui.dropZone.innerHTML = '<div class="drop-placeholder" id="dropPlaceholder">將注音拖曳至此</div>';
                    ui.dropPlaceholder = document.getElementById('dropPlaceholder');
                    
                    // 移除所有 used 標記
                    const options = ui.optionsContainer.querySelectorAll('.option-item');
                    options.forEach(opt => opt.classList.remove('used'));
                    
                    ui.feedback.className = 'feedback-msg';
                    state.selectedAnswer = null;
                    setupDragAndDrop();
                }, 2000);
            }
            updateStats();
        }

        function updateStats() {
            ui.stats.current.textContent = Math.min(state.currentIndex + 1, state.queue.length);
            ui.stats.total.textContent = state.queue.length;
            ui.stats.correct.textContent = state.correctCount;
            
            const acc = state.attempts === 0 ? 0 : Math.round((state.correctCount / state.attempts) * 100);
            ui.stats.accuracy.textContent = `${acc}%`;
            
            const progressPct = (state.currentIndex / state.queue.length) * 100;
            ui.progress.style.width = `${progressPct}%`;
        }

        function showCompletion() {
            ui.practiceArea.style.display = 'none';
            ui.completionScreen.style.display = 'block';
            ui.progress.style.width = '100%';
        }

        init();
    </script>
